name: Build Creative Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract original Android project
        run: |
          unzip -q creative_library_android_source_v1.zip -d extracted
          test -f extracted/creative_library_android_project/settings.gradle.kts

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Java and Kotlin targets to 17
        working-directory: extracted/creative_library_android_project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              pos = s.rfind("\n}")
              if pos < 0:
                  raise SystemExit("Could not find android block")
              settings = """
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              s = s[:pos] + settings + s[pos:]
              p.write_text(s)
          PY

      - name: Build APK
        working-directory: extracted/creative_library_android_project
        run: gradle --version && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Creative-Library-APK
          path: extracted/creative_library_android_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
