name: Build Creative Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'creative_library_android_project.zip'
      - 'creative_library_android_project .zip'
      - 'creative_library_with_companies_feature.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "creative_library_android_project.zip" ]; then
            ZIP_FILE="creative_library_android_project.zip"
          elif [ -f "creative_library_android_project .zip" ]; then
            ZIP_FILE="creative_library_android_project .zip"
          elif [ -f "creative_library_with_companies_feature.zip" ]; then
            ZIP_FILE="creative_library_with_companies_feature.zip"
          else
            echo "Project ZIP not found"
            exit 1
          fi

          echo "Using $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing SIGNING_KEYSTORE_BASE64 secret"
            exit 1
          fi

          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/creative-library.jks"

          test -s "$RUNNER_TEMP/creative-library.jks"

          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/creative-library.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Creative-Library-Signed-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
