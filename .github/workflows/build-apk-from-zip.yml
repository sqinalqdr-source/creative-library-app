name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate updated project ZIP
        id: locate
        shell: bash
        run: |
          if [ -f "creative_library_with_companies_feature.zip" ]; then
            echo "zip_file=creative_library_with_companies_feature.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "creative_library_android_source_v1.zip" ]; then
            echo "zip_file=creative_library_android_source_v1.zip" >> "$GITHUB_OUTPUT"
          else
            echo "لم يتم العثور على ملف ZIP المطلوب في جذر المستودع."
            ls -la
            exit 1
          fi

      - name: Extract project ZIP on GitHub runner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/creative-library-source"
          unzip -q "${{ steps.locate.outputs.zip_file }}" -d "$RUNNER_TEMP/creative-library-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/creative-library-source" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على settings.gradle.kts داخل ملف ZIP."
            find "$RUNNER_TEMP/creative-library-source" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "تم العثور على المشروع في: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: creative-library-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
